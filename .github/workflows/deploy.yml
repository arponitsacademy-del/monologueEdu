name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, zip
          coverage: none

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: ⚡ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🎨 Install NPM Dependencies & Build Vite Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 📦 Create Compressed Deployment Package (Fast & Reliable)
        run: |
          # 1. Clean previous staging directories
          rm -rf deploy_dist deploy_upload
          mkdir -p deploy_dist/app deploy_upload

          # 2. Copy Laravel backend core into app/
          cp -r app config database resources routes storage vendor artisan composer.json composer.lock deploy_dist/app/
          mkdir -p deploy_dist/app/bootstrap
          cp bootstrap/app.php deploy_dist/app/bootstrap/
          cp bootstrap/providers.php deploy_dist/app/bootstrap/ 2>/dev/null || true

          # 3. Ensure required cache folders exist inside app/storage
          mkdir -p deploy_dist/app/storage/framework/{cache,sessions,views}
          mkdir -p deploy_dist/app/storage/logs

          # 4. Copy public assets into public_html root
          cp -r public/build deploy_dist/
          [ -f public/robots.txt ] && cp public/robots.txt deploy_dist/ || true
          [ -f public/favicon.ico ] && cp public/favicon.ico deploy_dist/ || true

          # 5. Inject Hostinger production index.php and .htaccess
          cp .hostinger/index.php deploy_dist/index.php
          cp .hostinger/.htaccess deploy_dist/.htaccess

          # 6. Compress deploy_dist into a single zip file for ultra-fast transfer
          cd deploy_dist
          zip -q -r ../deploy_upload/deploy.zip .
          cd ..

          # 7. Add server-side extractor
          cp .hostinger/deploy_extract.php deploy_upload/deploy_extract.php

          echo "Deployment package prepared:"
          ls -lh deploy_upload/

      - name: 🚀 Upload Package via FTPS (Under 15 Seconds)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./deploy_upload/
          protocol: ftps
          port: 21
          dangerous-clean-slate: false

      - name: ⚡ Extract Package & Optimize on Server
        run: |
          echo "Extracting deployment package on Hostinger..."
          RESPONSE=$(curl -s "https://novonexdelta.com/deploy_extract.php?secret=NovonexDeploy_2026_DeltaSecretKey")
          echo "Server response: $RESPONSE"
          if [[ "$RESPONSE" == *"success"* ]]; then
            echo "✅ Deployment successful and verified!"
          else
            echo "❌ Extraction failed, see response above"
            exit 1
          fi
